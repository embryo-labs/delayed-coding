name: correctness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.88.0", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --offline --locked -- -D warnings
      - run: cargo test --workspace --offline --locked
      - run: cargo test --workspace --release --offline --locked
      - run: cargo test --features reference-division --offline --locked
      - run: cargo test --workspace --all-features --release --offline --locked
      - run: cargo test --workspace --features speculative-encode --offline --locked
      - run: cargo run --example indexed_records --offline --locked
      - run: cargo run --example fast_block --features speculative-encode --offline --locked
      - run: cargo test --example physical_lookahead --offline --locked
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j2 && ctest --test-dir build --output-on-failure
      - run: cmake -S tests/cmake_consumer -B build-consumer -DDELAYED_CODING_SOURCE_DIR="$PWD" && cmake --build build-consumer -j2 && ctest --test-dir build-consumer --output-on-failure
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-13
          components: miri, rust-src, rustfmt
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo miri test -p delayed-coding-ffi --test api
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo fuzz run codec -- -max_total_time=60 -max_len=4096 -print_final_stats=1
      - run: cargo fuzz run codec --features speculative-encode -- -max_total_time=60 -max_len=4096 -print_final_stats=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/checkout@v4
        with:
          repository: embryo-labs/Blitzcrank
          ref: 0ed9c97908c51440b30a2eef3c1b90325dd2c87c
          path: original-blitzcrank
          lfs: false
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDELAYED_CODING_BLITZCRANK_DIR="$PWD/original-blitzcrank" && cmake --build build -j2 && ctest --test-dir build --output-on-failure
      - run: cmake -S . -B build-flat -DCMAKE_BUILD_TYPE=Release -DDELAYED_CODING_FLAT_ALIAS=ON -DDELAYED_CODING_BLITZCRANK_DIR="$PWD/original-blitzcrank" && cmake --build build-flat -j2 && ctest --test-dir build-flat --output-on-failure
  rans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/checkout@v4
        with:
          repository: rygorous/ryg_rans
          ref: c9d162d996fd600315af9ae8eb89d832576cb32d
          path: upstream-rans
      - run: >-
          cmake -DUPSTREAM="$PWD/upstream-rans" -DOUTPUT_DIR="$PWD/build-original"
          -DCPU=none -P benchmarks/run_upstream_original.cmake
      - run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DDELAYED_CODING_RANS_DIR="$PWD/upstream-rans"
          -DDELAYED_CODING_BUILD_SIMD_BENCHMARK=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - run: cmake --build build -j2 && ctest --test-dir build --output-on-failure
